<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="https://th.bing.com/th/id/OIP.xvREvTvMwyRjAtmoLdfqkwHaD4?w=343&h=180&c=7&r=0&o=7&pid=1.7&rm=3">
    <title>LOPAL</title>
</head>
    <!-- CSS inline -->
    <body style="background-color: black; color: white;">

        <!-- Criando Marquee -->
        <marquee behavior="scroll" direction="right"><h1>Lopal</h1></marquee>
        <marquee behavior="scroll" direction="right"><h2>Lopal</h2></marquee>
        <marquee behavior="scroll" direction="right"><h3>Lopal</h3></marquee>
        <marquee behavior="scroll" direction="right"><h4>Lopal</h4></marquee>
        <marquee behavior="scroll" direction="right"><h5>Lopal</h5></marquee>
        <marquee behavior="scroll" direction="right"><h6>Lopal</h6></marquee>

        <!-- JavaScript -->
        <script>
            // Solicitar ao usuário dois números
            let a = prompt("Digite o 1° número: ")
            let b = prompt("Digite o 2° número: ")

            // Exibir o tipo dos valores(string)
            console.log(typeof(a));
            console.log(typeof(b));

            let conca = a + b // Concatenação

            // Converter os valores para números e somar
            let soma = parseFloat(a) + Number(b) // Soma

            // Exibir os resultados
            console.log("Concatenação: " + conca);
            console.log("Soma: " + soma);

        </script>
    </body>
</html>
