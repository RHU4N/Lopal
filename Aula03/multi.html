<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplicação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Multiplicação</h1>
    <p class="caminho"></p>
    <p class="conta"></p>

    <script>
        let a, b;
        while (true) {
            a = Number(prompt("Digite o 1° número: "));
            b = Number(prompt("Digite o 2° número: "));
            if (a === null || b === null) {
                alert("Por favor, insira valores válidos para ambos os números.");
                continue;
            }
            else if (isNaN(a) || isNaN(b)) {
                alert("Por favor, insira apenas valores numéricos.");
                continue;
            } 
            else {
                break;
            }
        }

        let multiplicacao = a * b; // Multiplicação
        document.querySelector('.caminho').innerText = `Os numeros escolhidos pelo usuário foram ${a} e ${b}`;
        document.querySelector('.conta').innerText = `A multiplicação entre ${a} * ${b} = ${multiplicacao}`;

        // Exibir os resultados no console
        console.log(`Os numeros escolhidos pelo usuário foram ${a} e ${b}`);
        console.log("Multiplicação: " + multiplicacao);
    </script>
</body>
</html>
